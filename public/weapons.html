<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====================================================
       VALORANT PROTOCOL 2026 — weapons.html
       Complete weapon arsenal with comparison tool
       Authors: Ysa Rosario & Nathan Ogerio
       ==================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VALORANT Protocol 2026 Arsenal — All weapons, stats, and the new Bandit pistol. Compare any two weapons side by side." />
  <meta name="keywords" content="Valorant weapons, Phantom, Vandal, Operator, Bandit, arsenal, guns" />
  <meta name="author" content="Ysa Rosario, Nathan Ogerio" />
  <title>Arsenal — VALORANT PROTOCOL 2026</title>
  <link rel="icon" type="image/png" href="assets/valorant.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/weapons.css" />
</head>
<body>

  <div id="loading-screen">
    <img src="assets/valorant.png" alt="Valorant Logo" class="loading-logo" />
    <div class="loading-bar-container"><div class="loading-bar"></div></div>
    <p class="loading-text">LOADING ARSENAL...</p>
  </div>

  <div id="navbar-placeholder"></div>

  <div id="lore-overlay">
    <h2>⚠ CLASSIFIED FOOTAGE ⚠</h2>
    <div id="lore-video-container">
      <div class="lore-icon">📡</div>
      <p style="color:var(--primary);font-family:var(--font-mono);font-size:0.85rem">EARTH-2 TRANSMISSION INTERCEPTED</p>
    </div>
    <button id="lore-close">CLOSE TRANSMISSION</button>
  </div>

  <!-- ── HERO ── -->
  <section class="page-hero weapons-hero">
    <div class="page-hero-title">
      <span class="section-label">Patch 12.0 — 19 Weapons</span>
      <h1 class="display-lg">ARSENAL</h1>
    </div>
    <p class="page-hero-subtitle">Every weapon. Every stat. Choose your loadout.</p>
    <div class="weapons-filter-bar">
      <button class="filter-btn active" data-cat="all">ALL</button>
      <button class="filter-btn" data-cat="sidearms">SIDEARMS</button>
      <button class="filter-btn" data-cat="smgs">SMGs</button>
      <button class="filter-btn" data-cat="shotguns">SHOTGUNS</button>
      <button class="filter-btn" data-cat="rifles">RIFLES</button>
      <button class="filter-btn" data-cat="snipers">SNIPERS</button>
      <button class="filter-btn" data-cat="machine-guns">MGs</button>
      <button class="filter-btn" data-cat="melee">MELEE</button>
    </div>
  </section>

  <!-- ── WEAPON COMPARISON TOOL ── -->
  <section class="section weapons-compare">
    <div class="container">
      <div class="section-header">
        <span class="section-label"> Comparison Tool</span>
        <h2>WEAPON COMPARE</h2>
      </div>
      <div class="compare-tool">
        <div class="compare-select-wrap">
          <div class="compare-slot">
            <label>WEAPON A</label>
            <select id="compare-a" class="compare-select"></select>
          </div>
          <div class="compare-vs">VS</div>
          <div class="compare-slot">
            <label>WEAPON B</label>
            <select id="compare-b" class="compare-select"></select>
          </div>
        </div>
        <button class="btn btn-primary" id="run-compare-btn" onclick="runComparison()">COMPARE →</button>
        <div id="compare-result" class="compare-result" style="display:none">
          <div class="compare-bars" id="compare-bars"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── WEAPONS GRID ── -->
  <main class="section weapons-main">
    <div class="container">
      <div id="weapons-grid"></div>
    </div>
  </main>

  <!-- ── WEAPON MODAL ── -->
  <div id="weapon-modal" class="agent-modal">
    <div class="agent-modal-backdrop" onclick="closeWeaponModal()"></div>
    <div class="agent-modal-content">
      <button class="modal-close" onclick="closeWeaponModal()">✕</button>
      <div id="weapon-modal-body"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/global.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/weapons.js"></script>
</body>
</html>
