<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====================================================
       VALORANT PROTOCOL 2026 — agents.html
       Complete agent database — all roles and abilities
       Authors: Ysa Rosario & Nathan Ogerio
       ==================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VALORANT Protocol 2026 Agents — Complete database of all 22 agents including new additions Veto and Tejo." />
  <meta name="keywords" content="Valorant agents, Jett, Reyna, Sage, Sentinel, Duelist, Initiator, Controller, Veto, Tejo" />
  <meta name="author" content="Ysa Rosario, Nathan Ogerio" />
  <title>Agents — VALORANT PROTOCOL 2026</title>
 <link rel="icon" type="image/png" href="assets/valorant.png">
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/agents.css" />
</head>
<body>

  <div id="loading-screen">
    <img src="assets/valorant.png" alt="Valorant Logo" class="loading-logo" />
    <div class="loading-bar-container"><div class="loading-bar"></div></div>
    <p class="loading-text">LOADING AGENT FILES...</p>
  </div>

  <div id="navbar-placeholder"></div>

  <div id="lore-overlay">
    <h2>⚠ CLASSIFIED FOOTAGE ⚠</h2>
    <div id="lore-video-container">
      <div class="lore-icon">📡</div>
      <p style="color:var(--primary);font-family:var(--font-mono);font-size:0.85rem;letter-spacing:0.1em">EARTH-2 TRANSMISSION INTERCEPTED</p>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.6);margin-top:8px">Welcome to My World — 2026 Omega Breach Cinematic</p>
    </div>
    <button id="lore-close">CLOSE TRANSMISSION</button>
  </div>

  <!-- ── HERO ── -->
  <section class="page-hero agents-hero">
    <div class="page-hero-title">
      <span class="section-label">Patch 12.0 — 22 Agents</span>
      <h1 class="display-lg">AGENT DATABASE</h1>
    </div>
    <p class="page-hero-subtitle">Radiant-powered operatives and skilled soldiers. Choose your protocol.</p>
    <!-- Filter Bar -->
    <div class="agents-filter-bar">
      <button class="filter-btn active" data-role="all">ALL <span class="filter-count" id="count-all">22</span></button>
      <button class="filter-btn" data-role="duelist">DUELISTS <span class="filter-count">7</span></button>
      <button class="filter-btn" data-role="initiator">INITIATORS <span class="filter-count">7</span></button>
      <button class="filter-btn" data-role="controller">CONTROLLERS <span class="filter-count">6</span></button>
      <button class="filter-btn" data-role="sentinel">SENTINELS <span class="filter-count">7</span></button>
    </div>
    <!-- Search -->
    <div class="agents-search-wrap">
      <input type="text" id="agent-search" class="agents-search" placeholder="Search agents..." autocomplete="off" />
      <span class="search-icon">🔍</span>
    </div>
  </section>

  <!-- ── AGENTS GRID ── -->
  <main class="section agents-main">
    <div class="container">
      <!-- Role sections will be populated by JS -->
      <div id="agents-grid" class="agents-grid"></div>
      <p id="no-results" class="no-results" style="display:none">No agents found.</p>
    </div>
  </main>

  <!-- ── AGENT MODAL ── -->
  <div id="agent-modal" class="agent-modal">
    <div class="agent-modal-backdrop" onclick="closeAgentModal()"></div>
    <div class="agent-modal-content">
      <button class="modal-close" onclick="closeAgentModal()">✕</button>
      <div id="agent-modal-body"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/global.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/agents.js"></script>
</body>
</html>
